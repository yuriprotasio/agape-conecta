<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if not campo.field.required %} <span class="opcional">(opcional)</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<p class="ajuda" id="{{ campo.auto_id }}_ajuda">{{ campo.help_text }}</p>{% endif %}
  {% for erro in campo.errors %}<p class="erro-campo" role="alert"><span aria-hidden="true">⚠</span> {{ erro }}</p>{% endfor %}
</div>
