{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "erros_form.html" %}
  {% for campo in form %}{% include "campo.html" %}{% endfor %}
  <div class="linha-acoes"><button class="btn" type="submit">Salvar</button>
  <a class="btn btn-sec" href="{% url 'gestao:beneficiarios' %}">Cancelar</a></div>
</form>
{% endblock %}
